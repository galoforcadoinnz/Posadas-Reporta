<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posadas Reporta</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .success-message {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            border: 1px solid #c3e6cb;
        }
        .error-message {
            display: none;
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            border: 1px solid #f5c6cb;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .reports-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }
        .reports-section h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .report-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        .report-card h3 {
            color: #667eea;
            margin-bottom: 5px;
        }
        .report-card p {
            color: #666;
            margin-bottom: 5px;
        }
        .report-card .date {
            color: #999;
            font-size: 0.9em;
        }
        .no-reports {
            text-align: center;
            color: #999;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📍 Posadas Reporta</h1>
        <p class="subtitle">Reportá problemas de tu ciudad de forma anónima</p>
        
        <form id="reportForm">
            <div class="form-group">
                <label for="category">Categoría del problema</label>
                <select id="category" required>
                    <option value="">Seleccioná una categoría</option>
                    <option value="bache">🕳️ Bache en la calle</option>
                    <option value="luminaria">💡 Luminaria rota</option>
                    <option value="basura">🗑️ Basura acumulada</option>
                    <option value="plaza">🌳 Plaza en mal estado</option>
                    <option value="transito">🚦 Problema de tránsito</option>
                    <option value="otro">⚠️ Otro</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="location">Ubicación (calle y referencia)</label>
                <input type="text" id="location" placeholder="Ej: Av. Lavalle y Colón, cerca del supermercado" required>
            </div>
            
            <div class="form-group">
                <label for="description">Descripción del problema</label>
                <textarea id="description" placeholder="Describí el problema con el mayor detalle posible..." required></textarea>
            </div>
            
            <button type="submit" id="submitBtn">Enviar Reporte</button>
        </form>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Enviando reporte...</p>
        </div>
        
        <div class="success-message" id="successMessage">
            ✅ ¡Reporte enviado correctamente! Gracias por colaborar con la ciudad.
        </div>
        
        <div class="error-message" id="errorMessage">
            ❌ Hubo un error al enviar el reporte. Intentá de nuevo.
        </div>
        
        <div class="reports-section">
            <h2>📋 Reportes Recientes</h2>
            <div id="reportsList">
                <div class="no-reports">Cargando reportes...</div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURACIÓN DE SUPABASE (YA CON TUS CREDENCIALES)
        // ============================================
        const SUPABASE_URL = 'https://bmcxzmkfwccjrrfpcfrs.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtY3h6bWtmd2NjanJyZnBjZnJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NzQ4ODMsImV4cCI6MjEwMTI1MDg4M30.4Rob9YlAR6ZWWcTOG1IN7IxzX8zVI1YMxZ1q_qB7O38';
        
        // Inicializar Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Referencias a elementos del DOM
        const form = document.getElementById('reportForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');
        const reportsList = document.getElementById('reportsList');
        
        // ============================================
        // ENVIAR REPORTE
        // ============================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Mostrar loading
            submitBtn.disabled = true;
            loading.style.display = 'block';
            successMessage.style.display = 'none';
            errorMessage.style.display = 'none';
            
            // Obtener valores
            const category = document.getElementById('category').value;
            const location = document.getElementById('location').value.trim();
            const description = document.getElementById('description').value.trim();
            
            try {
                const { data, error } = await supabase
                    .from('reports')
                    .insert([
                        {
                            category: category,
                            location: location,
                            description: description,
                            created_at: new Date().toISOString()
                        }
                    ]);
                
                if (error) throw error;
                
                // Éxito
                loading.style.display = 'none';
                successMessage.style.display = 'block';
                form.reset();
                
                // Recargar reportes
                loadReports();
                
                // Ocultar mensaje de éxito después de 5 segundos
                setTimeout(() => {
                    successMessage.style.display = 'none';
                }, 5000);
                
            } catch (err) {
                console.error('Error:', err);
                loading.style.display = 'none';
                errorMessage.style.display = 'block';
                errorMessage.textContent = '❌ Error: ' + err.message;
            } finally {
                submitBtn.disabled = false;
            }
        });
        
        // ============================================
        // CARGAR REPORTES
        // ============================================
        async function loadReports() {
            try {
                const { data: reports, error } = await supabase
                    .from('reports')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(10);
                
                if (error) throw error;
                
                if (!reports || reports.length === 0) {
                    reportsList.innerHTML = '<div class="no-reports">No hay reportes aún. ¡Sé el primero en reportar!</div>';
                    return;
                }
                
                // Mapear categorías a emojis
                const categoryEmojis = {
                    'bache': '🕳️',
                    'luminaria': '💡',
                    'basura': '🗑️',
                    'plaza': '🌳',
                    'transito': '🚦',
                    'otro': '⚠️'
                };
                
                const categoryNames = {
                    'bache': 'Bache en la calle',
                    'luminaria': 'Luminaria rota',
                    'basura': 'Basura acumulada',
                    'plaza': 'Plaza en mal estado',
                    'transito': 'Problema de tránsito',
                    'otro': 'Otro'
                };
                
                reportsList.innerHTML = reports.map(report => {
                    const date = new Date(report.created_at);
                    const formattedDate = date.toLocaleDateString('es-AR', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                    
                    const emoji = categoryEmojis[report.category] || '⚠️';
                    const catName = categoryNames[report.category] || report.category;
                    
                    return `
                        <div class="report-card">
                            <h3>${emoji} ${catName}</h3>
                            <p><strong>📍 Ubicación:</strong> ${report.location}</p>
                            <p><strong>📝 Descripción:</strong> ${report.description}</p>
                            <p class="date">🕐 ${formattedDate}</p>
                        </div>
                    `;
                }).join('');
                
            } catch (err) {
                console.error('Error cargando reportes:', err);
                reportsList.innerHTML = '<div class="no-reports">Error al cargar los reportes. Recargá la página.</div>';
            }
        }
        
        // Cargar reportes al iniciar
        loadReports();
    </script>
</body>
</html>
