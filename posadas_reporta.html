<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posadas Reporta — Prototipo</title>
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  :root {
    --bg: #ffffff; --text: #111111; --text-secondary: #555555; --text-muted: #888888;
    --border: #e0e0e0; --surface: #f5f5f5; --accent: #2563eb; --radius: 10px;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--bg); z-index: 10; }
  header h1 { font-size: 18px; font-weight: 600; }
  header span { font-size: 12px; color: var(--text-muted); }
  .badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: var(--surface); color: var(--text-secondary); font-weight: 500; }
  main { flex: 1; display: flex; position: relative; }
  #map { flex: 1; position: relative; }
  .sidebar { width: 340px; border-left: 1px solid var(--border); background: var(--bg); display: flex; flex-direction: column; }
  .sidebar-header { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .sidebar-header h2 { font-size: 15px; font-weight: 600; }
  .sidebar-header p { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
  .report-list { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .report-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; cursor: pointer; transition: all 0.15s ease; background: var(--bg); }
  .report-card:hover { border-color: var(--text-muted); box-shadow: var(--shadow); }
  .report-card .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .report-card .cat { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 6px; text-transform: lowercase; }
  .cat-bache { background: #fef3c7; color: #92400e; }
  .cat-alumbrado { background: #dbeafe; color: #1e40af; }
  .cat-inseguridad { background: #fee2e2; color: #991b1b; }
  .cat-basura { background: #dcfce7; color: #166534; }
  .cat-otro { background: var(--surface); color: var(--text-secondary); }
  .report-card .time { font-size: 11px; color: var(--text-muted); }
  .report-card .desc { font-size: 13px; color: var(--text-secondary); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .report-card .loc { font-size: 11px; color: var(--text-muted); margin-top: 6px; display: flex; align-items: center; gap: 4px; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
  .form-overlay { position: absolute; bottom: 20px; left: 20px; width: 320px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; z-index: 5; display: none; }
  .form-overlay.show { display: block; animation: slideUp 0.2s ease; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .form-overlay h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 5px; }
  .form-group select, .form-group textarea, .form-group input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 13px; outline: none; background: var(--bg); color: var(--text); }
  .form-group select:focus, .form-group textarea:focus, .form-group input:focus { border-color: var(--text); }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .form-actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
  .btn-primary { background: var(--text); color: var(--bg); }
  .btn-primary:hover { opacity: 0.85; }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .map-popup { font-family: var(--font); font-size: 12px; max-width: 200px; }
  .map-hint { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 18px; border-radius: 20px; font-size: 12px; font-weight: 500; z-index: 5; box-shadow: var(--shadow); pointer-events: none; opacity: 0.9; }
  @media (max-width: 768px) { main { flex-direction: column; } .sidebar { width: 100%; height: 40%; border-left: none; border-top: 1px solid var(--border); } .form-overlay { left: 10px; right: 10px; width: auto; bottom: 10px; } }
</style>
</head>
<body>
<header><div><h1>Posadas Reporta</h1><span>prototipo v0.1 — datos locales</span></div><span class="badge" id="count-badge">0 reportes</span></header>
<main>
  <div id="map"><div class="map-hint">hacé clic en el mapa para reportar un problema</div>
    <div class="form-overlay" id="form-overlay">
      <h3>nuevo reporte</h3>
      <div class="form-group"><label>categoría</label><select id="cat-select"><option value="bache">bache</option><option value="alumbrado">alumbrado público</option><option value="inseguridad">inseguridad</option><option value="basura">basura / limpieza</option><option value="otro">otro</option></select></div>
      <div class="form-group"><label>descripción</label><textarea id="desc-input" placeholder="¿qué problema hay en este lugar?"></textarea></div>
      <div class="form-actions"><button class="btn btn-secondary" onclick="cancelReport()">cancelar</button><button class="btn btn-primary" onclick="submitReport()">guardar</button></div>
    </div>
  </div>
  <aside class="sidebar"><div class="sidebar-header"><h2>reportes recientes</h2><p>en posadas y alrededores</p></div><div class="report-list" id="report-list"><div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48" style="margin-bottom:12px;opacity:0.4"><path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 7m0 13V7"/></svg><p>no hay reportes todavía.<br>hacé clic en el mapa para crear el primero.</p></div></div></aside>
</main>
<script>
const POSADAS_CENTER = [-55.9005, -27.3678]; const STORAGE_KEY = 'posadas_reporta_v1';
let reports = []; let tempCoords = null; let markers = [];
const map = new maplibregl.Map({ container: 'map', style: { version: 8, sources: { osm: { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256, attribution: '&copy; OpenStreetMap contributors' } }, layers: [{ id: 'osm', type: 'raster', source: 'osm' }] }, center: POSADAS_CENTER, zoom: 13 });
map.addControl(new maplibregl.NavigationControl(), 'top-right');
map.addControl(new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: true }, trackUserLocation: true }), 'top-right');
function loadReports() { const raw = localStorage.getItem(STORAGE_KEY); if (raw) { try { reports = JSON.parse(raw); renderAll(); } catch(e) {} } }
function saveReports() { localStorage.setItem(STORAGE_KEY, JSON.stringify(reports)); }
map.on('click', (e) => { tempCoords = [e.lngLat.lng, e.lngLat.lat]; document.getElementById('form-overlay').classList.add('show'); document.getElementById('desc-input').focus(); });
function cancelReport() { document.getElementById('form-overlay').classList.remove('show'); tempCoords = null; document.getElementById('cat-select').value = 'bache'; document.getElementById('desc-input').value = ''; }
function submitReport() { const cat = document.getElementById('cat-select').value; const desc = document.getElementById('desc-input').value.trim() || 'sin descripción'; if (!tempCoords) return; reports.unshift({ id: Date.now(), lat: tempCoords[1], lng: tempCoords[0], category: cat, description: desc, createdAt: new Date().toISOString() }); saveReports(); renderAll(); cancelReport(); }
function renderAll() { renderMarkers(); renderList(); document.getElementById('count-badge').textContent = reports.length + ' reporte' + (reports.length !== 1 ? 's' : ''); }
function renderMarkers() { markers.forEach(m => m.remove()); markers = []; const colors = { bache: '#f59e0b', alumbrado: '#2563eb', inseguridad: '#dc2626', basura: '#16a34a', otro: '#6b7280' }; reports.forEach(r => { const el = document.createElement('div'); el.style.cssText = 'width:18px;height:18px;background:'+(colors[r.category]||colors.otro)+';border-radius:50%;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.3);cursor:pointer;'; const popup = new maplibregl.Popup({ offset: 8 }).setHTML('<div class="map-popup"><strong style="text-transform:capitalize">'+r.category+'</strong><div style="color:#555;margin:3px 0">'+escapeHtml(r.description)+'</div><div style="color:#888;font-size:11px">'+formatDate(r.createdAt)+'</div></div>'); const marker = new maplibregl.Marker({ element: el }).setLngLat([r.lng, r.lat]).setPopup(popup).addTo(map); el.addEventListener('click', () => highlightReport(r.id)); markers.push(marker); }); }
function renderList() { const container = document.getElementById('report-list'); if (reports.length === 0) { container.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48" style="margin-bottom:12px;opacity:0.4"><path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 7m0 13V7"/></svg><p>no hay reportes todavía.<br>hacé clic en el mapa para crear el primero.</p></div>'; return; } container.innerHTML = reports.map(r => '<div class="report-card" data-id="'+r.id+'" onclick="flyToReport('+r.id+')"><div class="top"><span class="cat cat-'+r.category+'">'+r.category+'</span><span class="time">'+formatDate(r.createdAt)+'</span></div><div class="desc">'+escapeHtml(r.description)+'</div><div class="loc"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>'+r.lat.toFixed(4)+', '+r.lng.toFixed(4)+'</div></div>').join(''); }
function flyToReport(id) { const r = reports.find(x => x.id === id); if (!r) return; map.flyTo({ center: [r.lng, r.lat], zoom: 16, duration: 800 }); highlightReport(id); }
function highlightReport(id) { document.querySelectorAll('.report-card').forEach(c => c.classList.remove('active')); const card = document.querySelector('.report-card[data-id="'+id+'"]'); if (card) { card.classList.add('active'); card.scrollIntoView({ behavior: 'smooth', block: 'center' }); } }
function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
function formatDate(iso) { const d = new Date(iso); return d.toLocaleDateString('es-AR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
if (!localStorage.getItem(STORAGE_KEY + '_seeded')) { const demo = [{ id: 1, lat: -27.3621, lng: -55.8934, category: 'bache', description: 'bache grande en calle bolívar y urquiza, peligroso para motos', createdAt: new Date(Date.now() - 86400000 * 2).toISOString() }, { id: 2, lat: -27.3712, lng: -55.9056, category: 'alumbrado', description: 'lamparita quemada hace 3 semanas, calle muy oscura', createdAt: new Date(Date.now() - 86400000 * 5).toISOString() }, { id: 3, lat: -27.3589, lng: -55.8887, category: 'basura', description: 'contenedor desbordado, hace mal olor', createdAt: new Date(Date.now() - 86400000 * 1).toISOString() }]; reports = demo; saveReports(); localStorage.setItem(STORAGE_KEY + '_seeded', 'true'); renderAll(); } else { loadReports(); }
</script>
</body>
</html>
